<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbdh5y6_Xvk2WVeSo1dp6cYui1u-DLpbhemHQ8442ykQ&s=10">
   <title>Easy Paint</title>
   <meta name="description" content="Easy Paint — app for paint">
</head>
<body>
   
   <canvas></canvas>

   <input id="color" value="#000000" type="color" title="Select color-1"/>
   <input id="color2" value="#dddddd" type="color" title="Select color-2"/>

   <input id="text" type="text" oninput="textF()" onfocus="select()" placeholder="this is for (text)"/>

   <h2 id="inpText">100% square or circle</h2>
   <input id="square_square" type="checkbox" title="100% square or circle"/>

   <select name="pencil" id="pencil" onclick="seeText_and_seeSquareSquare ()" title="Select tool">
      <option value="pencil">pencil: 🖍</option>

      <option value="line">line: —</option>
      <option value="line2">line with circle ends: —</option>

      <option value="square">square without middle: 🔳</option>
      <option value="square2">square: ⬜</option>

      <option value="circle">circle without middle: ⭕</option>
      <option value="circle2">circle: 🔴</option>

      <option value="text">text: Abc</option>
<!--
      <option value="move">move: 🖐️</option>
-->
      <option value="retin">eraser: ●</option>
<!--
      <option value="filling">filling: 🔲→⬛</option>
-->
   </select>

   <select name="linewidth" id="lineWidth" title="Select line-with">
      <option value="1">Line width: 1</option>
      <option value="2">Line width: 2</option>
      <option value="3">Line width: 3</option>
      <option value="4">Line width: 4</option>
      <option value="5">Line width: 5</option>

      <option value="6">Line width: 6</option>
      <option value="7">Line width: 7</option>
      <option value="8">Line width: 8</option>
      <option value="9">Line width: 9</option>
      <option value="10">Line width: 10</option>

      <option value="12">Line width: 12</option>
      <option value="15">Line width: 15</option>
      <option value="20">Line width: 20</option>
   </select>
<!--
   <button id="BackBtn">Back: ↩</button>
   <button id="ForwardBtn">Forward: ↪</button>
-->

   <div id="imageNameBackground"></div>

   <input id="imageName" placeholder="Enter image name"/>
   <button id="agreeBtnForImageName" onclick="toHaveImageName()" title="Enter image name">Enter: ✅</button>
   <button id="canselBtn" onclick="cansel()" title="Cansel image name">Cansel: ❌</button>
   

   <button id="FullscreenBtn" onclick="Fullscreen()" title="Fullscreen">Fullscreen: ⛶</button>

   <button onclick="clear1()" id="clearBtn" title="Clean all">Clean all 🗑</button>

   <input type="file" accept="image/*" id="addImage" title="Select image: 🖼"/>

   <button onclick="install()" id="saveBtn" title="Save image">Save 📥</button>

<!-- -CSS & JS- -->
   <link rel="stylesheet" href="paint.css"/>
   <script src="paint.js" defer></script>
</body>
</html>
